<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #1a1a1a; }
</style>
</head>
<body class="h-screen flex items-center justify-center gap-32">
  <div class="relative flex flex-col items-center">
    <!-- Glow -->
    <div class="absolute top-10 w-96 h-96 bg-yellow-200/20 blur-[80px] rounded-full pointer-events-none"></div>
    
    <!-- Lampshade -->
    <div class="w-48 h-20 bg-[#f4f4f5] rounded-t-full relative z-10 shadow-[inset_0_-2px_10px_rgba(0,0,0,0.1)]"></div>
    
    <!-- Pull chain -->
    <div class="absolute top-20 left-1/2 ml-6 w-[2px] h-20 bg-gray-400/60 z-10 flex flex-col items-center justify-end group cursor-pointer">
      <div class="w-3 h-3 bg-yellow-600 rounded-full translate-y-1 group-hover:translate-y-4 transition-transform"></div>
    </div>
    
    <!-- Stand -->
    <div class="w-4 h-48 bg-[#e4e4e7] z-10"></div>
    
    <!-- Base -->
    <div class="w-32 h-4 bg-[#f4f4f5] rounded-full z-10"></div>
  </div>

  <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-10 rounded-3xl w-full max-w-sm shadow-2xl flex flex-col gap-6">
    <h2 class="text-white text-2xl font-semibold text-center mb-2">Welcome</h2>
    
    <div class="flex flex-col gap-2">
      <label class="text-white/60 text-sm">Password</label>
      <input type="password" placeholder="Enter Password" class="bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-white placeholder-white/30 focus:outline-none focus:border-yellow-500/50 transition-colors" />
    </div>

    <button class="mt-4 w-full bg-gradient-to-r from-yellow-200 via-yellow-400 to-yellow-200 text-yellow-900 font-bold py-3 rounded-xl shadow-[0_0_20px_rgba(250,204,21,0.3)] hover:shadow-[0_0_30px_rgba(250,204,21,0.5)] transition-all">
      Sign In
    </button>
  </div>
</body>
</html>
